<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PoeClone · Sound board</title>
<style>
:root{color-scheme:dark;font-family:Segoe UI,system-ui,sans-serif;background:#101417;color:#e7eae6;--gold:#e4bd79;--line:#354044}
*{box-sizing:border-box}body{margin:0}header,main,footer>div{max-width:1500px;margin:auto;padding:24px 32px}header{padding-top:36px}h1{font:36px Georgia,serif;margin:6px 0 12px}.eyebrow{color:var(--gold);font-size:12px;letter-spacing:3px}p{color:#acb8b8;line-height:1.6;margin:6px 0}button,input,select{font:inherit}button,select,input[type=search]{background:#202a2e;color:#e7eae6;border:1px solid var(--line);border-radius:6px;padding:9px 12px}button{cursor:pointer}button:hover{border-color:var(--gold)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}button:disabled{opacity:.45;cursor:default}.toolbar{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}input[type=search]{flex:1;min-width:220px}.count{padding:10px;color:var(--gold)}main{padding-top:0;padding-bottom:150px}.effect{padding:22px;background:#192125;border:1px solid var(--line);border-radius:10px;margin:14px 0}.heading{display:flex;align-items:center;gap:18px;justify-content:space-between}.heading h2{font-size:18px;margin:0}.group{font-size:11px;text-transform:uppercase;color:var(--gold);letter-spacing:1px;margin-bottom:5px}.volume{display:flex;align-items:center;gap:8px;white-space:nowrap}.volume input{accent-color:var(--gold);width:140px}.volume output{width:43px;text-align:right}.description{font-size:13px;margin:10px 0 16px}.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.option{display:flex;align-items:center;gap:8px;background:#12191c;border:1px solid var(--line);border-radius:6px;padding:10px;min-width:0}.option:has(input:checked){border-color:var(--gold);background:#2b2a23}.option input{accent-color:var(--gold)}.option label{display:flex;align-items:center;gap:8px;flex:1;min-width:0;cursor:pointer}.clipname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}.option button{padding:5px 9px;font-size:12px}.tag{display:block;color:#8c9a9e;font-size:10px;margin-bottom:4px}.option.mute{grid-column:1/-1}.mute span{font-size:13px}.error{color:#ffa49b}footer{position:fixed;bottom:0;left:0;right:0;background:#101417f5;border-top:1px solid var(--line);backdrop-filter:blur(14px)}footer>div{display:flex;align-items:center;gap:12px;padding-top:17px;padding-bottom:17px}#status{flex:1;font-size:13px}#apply{background:var(--gold);color:#171b1d;font-weight:700;border:0;padding:13px 25px}#empty{padding:30px;text-align:center}[hidden]{display:none!important}@media(max-width:850px){.options{grid-template-columns:1fr 1fr}.heading{align-items:flex-start;flex-direction:column;gap:12px}header,main,footer>div{padding-left:16px;padding-right:16px}footer>div{flex-wrap:wrap}#status{flex-basis:100%}}@media(max-width:520px){.options{grid-template-columns:1fr}}
</style>
<header><div class="eyebrow">POECLONE / AUDIO WORKSHOP</div><h1>Give the world a voice.</h1><p>Compare the current recording with five suggestions from your inspiration library.<br>Choose a sound, set its volume, or silence it. Apply saves every row, including hidden rows, to the project.</p><div class="toolbar"><input id="search" type="search" placeholder="Search effects or enemies…" aria-label="Search effects"><select id="group" aria-label="Filter category"><option value="">All categories</option></select><button id="stop">Stop preview</button><span id="count" class="count"></span></div></header>
<main><div id="effects"></div><p id="empty" hidden>No effects match this filter.</p></main>
<footer><div><span id="status" role="status">Loading sounds…</span><button id="discard">Discard edits</button><button id="apply" disabled>Apply changes</button></div></footer>
<script>
'use strict';
const $ = id => document.getElementById(id);
let rows = [], draft = new Map(), saved = new Map(), token, activeAudio, activeButton, previewRow, dirty = false, applying = false;
const copy = value => JSON.parse(JSON.stringify(value));
function stop() { if(activeAudio){activeAudio.pause();activeAudio.src='';activeAudio=null;}if(activeButton)activeButton.textContent='▶ Play';activeButton=null;previewRow=null; }
function message(text,error=false){$('status').textContent=text;$('status').classList.toggle('error',error);}
function changed(){dirty=JSON.stringify([...draft.values()])!==JSON.stringify([...saved.values()]);$('apply').disabled=!dirty;message(dirty?'You have unapplied changes.':'All choices are saved.');}
function clipLabel(path){return path.split('/').pop().replace(/-\d{10,}(?=\.)/,'').replace(/_/g,' ');}
function preview(row,path,button){
 if(activeButton===button){stop();return;}stop();activeButton=button;previewRow=row.id;
 activeAudio=new Audio('/audio?path='+encodeURIComponent(path));activeAudio.volume=draft.get(row.id).volume;button.textContent='■ Stop';
 activeAudio.onended=stop;activeAudio.onerror=()=>{stop();message('Could not play this recording.',true);};
 activeAudio.play().catch(error=>{stop();message('Preview could not start: '+error.message,true);});
}
function option(row,value,title,subtitle,path){
 const box=document.createElement('div');box.className='option'+(value==='mute'?' mute':'');
 const label=document.createElement('label'), radio=document.createElement('input');radio.type='radio';radio.name=row.id;radio.value=value;
 const choice=draft.get(row.id);radio.checked=value==='mute'?choice.muted:!choice.muted&&choice.path===value;
 radio.onchange=()=>{choice.muted=value==='mute';if(value!=='mute')choice.path=value;changed();};
 const text=document.createElement('span');text.className='clipname';text.title=path||title;
 const tag=document.createElement('span');tag.className='tag';tag.textContent=subtitle;text.append(tag,document.createTextNode(title));label.append(radio,text);box.append(label);
 if(path){const button=document.createElement('button');button.type='button';button.textContent='▶ Play';button.setAttribute('aria-label','Preview '+row.label+': '+title);button.onclick=()=>preview(row,path,button);box.append(button);}return box;
}
function render(){
 stop();$('effects').replaceChildren();const query=$('search').value.toLowerCase(),group=$('group').value;
 const visible=rows.filter(row=>(!group||row.group===group)&&`${row.label} ${row.description} ${row.group}`.toLowerCase().includes(query));
 $('count').textContent=`${visible.length} / ${rows.length} effects`;$('empty').hidden=visible.length>0;
 for(const row of visible){
  const card=document.createElement('section');card.className='effect';const heading=document.createElement('div');heading.className='heading';
  const title=document.createElement('div'),category=document.createElement('div'),name=document.createElement('h2');category.className='group';category.textContent=row.group;name.textContent=row.label;title.append(category,name);
  const volume=document.createElement('label');volume.className='volume';volume.append(document.createTextNode('Volume'));
  const slider=document.createElement('input');slider.type='range';slider.min=0;slider.max=100;slider.value=Math.round(draft.get(row.id).volume*100);slider.setAttribute('aria-label',row.label+' volume');
  const output=document.createElement('output');output.textContent=slider.value+'%';slider.oninput=()=>{draft.get(row.id).volume=Number(slider.value)/100;output.textContent=slider.value+'%';if(previewRow===row.id&&activeAudio)activeAudio.volume=Number(slider.value)/100;changed();};volume.append(slider,output);heading.append(title,volume);card.append(heading);
  const description=document.createElement('p');description.className='description';description.textContent=row.description||'Choose a recording or keep the current sound.';card.append(description);
  const options=document.createElement('div');options.className='options';
  const current=option(row,'','Keep current sound',row.current.length>1?`${row.current.length} random variations`:'Current default',row.current[0]);
  if(row.current.length>1){const cycle=document.createElement('button');cycle.textContent='Next variation';let index=0;cycle.onclick=()=>{index=(index+1)%row.current.length;preview(row,row.current[index],cycle);};current.append(cycle);}options.append(current);
  row.suggestions.forEach((path,index)=>options.append(option(row,path,clipLabel(path),`Suggestion ${index+1}`,path)));
  options.append(option(row,'mute','No sound','Mute this effect',null));card.append(options);$('effects').append(card);
 }
}
$('search').oninput=render;$('group').onchange=render;$('stop').onclick=stop;
$('discard').onclick=()=>{draft=new Map([...saved].map(([id,value])=>[id,copy(value)]));render();changed();};
$('apply').onclick=async()=>{
 if(applying)return;applying=true;const submitted=copy([...draft.values()]);$('apply').disabled=true;message('Saving project choices…');stop();
 try{const response=await fetch('/api/apply',{method:'POST',headers:{'Content-Type':'application/json','X-Board-Token':token},body:JSON.stringify({effects:submitted})});const result=await response.json();if(!response.ok)throw Error(result.error);saved=new Map(submitted.map(value=>[value.id,value]));changed();if(!dirty)message(result.message);}
 catch(error){message(error.message,true);$('apply').disabled=false;}finally{applying=false;}
};
window.addEventListener('beforeunload',event=>{if(dirty){event.preventDefault();event.returnValue='';}});
fetch('/api/board').then(response=>{if(!response.ok)throw Error('Could not load board');return response.json();}).then(data=>{
 rows=data.effects;token=data.token;const choices=new Map(data.choices.map(choice=>[choice.id,choice]));
 for(const row of rows){const choice=choices.get(row.id)||{id:row.id,path:'',muted:false,volume:1};draft.set(row.id,copy(choice));saved.set(row.id,copy(choice));}
 for(const group of [...new Set(rows.map(row=>row.group))]){const option=document.createElement('option');option.value=group;option.textContent=group;$('group').append(option);}render();changed();
}).catch(error=>message(error.message,true));
</script>
</html>
