      var config = {
        dataUrl: "Build/WebGL.data.unityweb" + v,
        frameworkUrl: "Build/WebGL.framework.js.unityweb" + v,
        codeUrl: "Build/WebGL.wasm.unityweb" + v,
        streamingAssetsUrl: "StreamingAssets",
        // Music bundles are named after their contents, so a cached copy is always current. Pages
        // gives every deploy new ETags, which otherwise re-downloads all music after each update.
        cacheControl: function (url) {
          if (/(^|\/)StreamingAssets\/Music\/[^?]+-[0-9a-f]{12}\.bundle$/.test(url)) return "immutable";
          return /\.bundle/.test(url) ? "must-revalidate" : "no-store";
        },
        companyName: "DefaultCompany",
        productName: "poe-clone",
        productVersion: "0.1.0",
        devicePixelRatio: pixelRatio(),
        // The loader copies this object into its module and fills in each file's bytes, keyed by URL.
        downloadProgress: {},
        showBanner: function (msg, type) { if (type === "error") showError(msg); else console.warn(msg); }
      };

      // What is downloading under the bar, then how long engine startup takes, so a slow load
      // can be pinned on a file or on startup. Each finished step is also logged to the console.
      var detail = document.getElementById("detail");
      var loadFiles = [
        { match: ".data", label: "Game assets (scenes, models, textures, sounds)" },
        { match: ".wasm", label: "Game code" },
        { match: ".framework.js", label: "Engine scripts" }
      ];
      var loadStart = performance.now(), startupStart = 0;
      function mb(bytes) { return (bytes / 1048576).toFixed(1) + " MB"; }
      function secs(ms) { return (ms / 1000).toFixed(1) + " s"; }
      function showLoadDetail() {
        var now = performance.now(), allDone = true, lines = [];
        loadFiles.forEach(function (f) {
          var url = Object.keys(config.downloadProgress).filter(function (u) { return u.indexOf(f.match) >= 0; })[0];
          var p = url ? config.downloadProgress[url] : null;
          var loaded = p ? (p.wireLoaded === undefined ? p.loaded : p.wireLoaded) : 0;
          var total = p ? (p.wireTotal === undefined ? p.total : p.wireTotal) : 0;
          if (p && p.finished && !f.end) {
            f.end = now;
            console.log("[Loading] " + f.label + ": " + mb(loaded) + " in " + secs(now - loadStart));
          }
          if (!f.end) allDone = false;
          lines.push(f.label + ": " + (f.end ? "done, " + mb(loaded) + " in " + secs(f.end - loadStart)
            : p && p.started ? mb(loaded) + (p.lengthComputable ? " of " + mb(total) : "") : "waiting"));
        });
        if (allDone) {
          if (!startupStart) startupStart = now;
          lines.push("Unpacking, starting the engine and the main menu: " + secs(now - startupStart));
        }
        detail.textContent = lines.join("\n");
      }
      var loadDetailTimer = setInterval(showLoadDetail, 200);
      function stopLoadDetail() {
        clearInterval(loadDetailTimer);
        if (startupStart) console.log("[Loading] Engine startup: " + secs(performance.now() - startupStart));
        console.log("[Loading] Total: " + secs(performance.now() - loadStart));
      }

      var script = document.createElement("script");
      script.onload = function () {
        if (script.src.indexOf("blob:") === 0) URL.revokeObjectURL(script.src);
        createUnityInstance(canvas, config, function (progress) {
          fill.style.width = Math.round(progress * 100) + "%";
          document.getElementById("bar").setAttribute("aria-valuenow", Math.round(progress * 100));
        }).then(function (instance) {
          restoreDownloads();
          unityInstance = instance;
          stopLoadDetail();
          resyncAfterLoad();
          loading.classList.add("done");
          if (!standalone) fsButton.style.display = "flex";
          canvas.focus();
          maybeShowIosHintOnce();
          watchForUpdates();
        }).catch(function (message) {
          restoreDownloads();
          clearInterval(loadDetailTimer);
          showError(String(message));
        });
      };
      // A new version went live: save, tell everyone, and reload onto it (players and spectators
      // alike). Check on wake as well as once a minute: mobile timers stop while asleep.
      function watchForUpdates() {
        if (v === "") return; // a local build that was never stamped
        var request = null, staging = false, readyBuild = null;
        async function readVersion(signal) {
          var response = await fetch("version.json?t=" + Date.now(), { cache: "no-store", signal: signal });
          return response.ok ? response.json() : null;
        }
        async function stageUpdate(info) {
          if (staging || updating) return;
          // Compatibility with releases made before the background-download manifest.
          if (!info.downloads) { reloadForUpdate(); return; }
          staging = true;
          try {
            await installChunkDownloads(info.downloads, "?v=" + encodeURIComponent(info.build), null, true).prefetch();
            readyBuild = info.build;
          } catch (error) {
            console.warn('[Update] Background download will retry:', error);
          } finally { staging = false; }
          if (readyBuild === info.build) setTimeout(function () { checkForUpdate(false); }, 0);
        }
        function checkForUpdate(replacePending) {
          if (updating || document.hidden) return;
          if (request && !replacePending) return;
          if (request) request.abort();
          var controller = new AbortController();
          request = controller;
          // A suspended/offline request must not block later wake checks.
          var timeout = setTimeout(function () { controller.abort(); }, 10000);
          readVersion(controller.signal)
            .then(function (info) {
              if (request !== controller) return;
              if (!info || !info.build || info.build === BUILD_ID) return;
              if (readyBuild === info.build) reloadForUpdate();
              else stageUpdate(info);
            })
            .catch(function () { /* offline for a moment: try again next time */ })
            .finally(function () {
              clearTimeout(timeout);
              if (request !== controller) return;
              request = null;
            });
        }
        document.addEventListener("visibilitychange", function () {
          checkForUpdate(true);
        });
        function resumeCheck() {
          if (document.hidden || updating) return;
          checkForUpdate(false);
        }
        window.addEventListener("pageshow", resumeCheck);
        window.addEventListener("focus", resumeCheck);
        window.addEventListener("online", resumeCheck);
        setInterval(function () { checkForUpdate(false); }, 60000);
        // Co-op partners stage their own download before acknowledging the update handoff.
        window.poeReloadForUpdate = resumeCheck;
        checkForUpdate(false);
      }

      // Cover and freeze immediately, then wait for Unity's durable save acknowledgement.
      var updating = false;
      function reloadForUpdate() {
        if (updating) return;
        updating = true;
        document.getElementById("loading-title").textContent = "Updating...";
        document.getElementById("detail").textContent = "Saving your character...";
        loading.classList.remove("done");
        fill.style.width = "0%";
        window.poeUpdateSaved = function (error) {
          window.poeUpdateSaved = null;
          if (error) {
            showError("The update could not save your progress. Please reload when browser storage is available. " + error);
            return;
          }
          location.reload();
        };
        try { unityInstance.SendMessage("GameSessionController", "BeginUpdate"); }
        catch (e) { window.poeUpdateSaved(String(e)); }
      }
      window.poeReloadForUpdate = reloadForUpdate;

      script.onerror = function () {
        restoreDownloads(); clearInterval(loadDetailTimer);
        if (script.src.indexOf("blob:") === 0) URL.revokeObjectURL(script.src);
        showError("The game files failed to load. Try reloading the page.");
      };
      if (typeof downloadChunks === "object") {
        restoreDownloads = installChunkDownloads(downloadChunks, v, function (url, loaded, total) {
          var key = Object.keys(config.downloadProgress).find(function (key) {
            return new URL(key, document.baseURI).href === url;
          }) || url;
          var p = config.downloadProgress[key] || (config.downloadProgress[key] = {});
          p.started = true; p.lengthComputable = true; p.loaded = loaded; p.total = total;
          p.wireLoaded = loaded; p.wireTotal = total;
          var downloads = Object.values(config.downloadProgress);
          var received = downloads.reduce(function (sum, item) { return sum + (item.wireLoaded || 0); }, 0);
          var expected = Object.values(downloadChunks).reduce(function (sum, item) { return sum + (item.transferSize || item.size); }, 0);
          fill.style.width = Math.round(90 * received / expected) + "%";
        });
        fetch("Build/WebGL.loader.js" + v).then(function (response) { return response.blob(); })
          .then(function (blob) {
            script.src = URL.createObjectURL(new Blob([blob], { type: "application/javascript" }));
            document.body.appendChild(script);
          }).catch(function (error) { restoreDownloads(); clearInterval(loadDetailTimer); showError(String(error)); });
      } else {
        script.src = "Build/WebGL.loader.js";
        document.body.appendChild(script);
      }
    </script>
  </body>
</html>
