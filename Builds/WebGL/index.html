          var loaded = p ? (p.wireLoaded === undefined ? p.loaded : p.wireLoaded) : 0;
          var total = p ? (p.wireTotal === undefined ? p.total : p.wireTotal) : 0;
          if (p && p.finished && !f.end) {
            f.end = now;
            console.log("[Loading] " + f.label + ": " + mb(loaded) + " in " + secs(now - loadStart));
          }
          if (!f.end) allDone = false;
          lines.push(f.label + ": " + (f.end ? "done, " + mb(loaded) + " in " + secs(f.end - loadStart)
            : p && p.started ? mb(loaded) + (p.lengthComputable ? " of " + mb(total) : "") : "waiting"));
        });
        if (allDone) {
          if (!startupStart) startupStart = now;
          lines.push("Unpacking, starting the engine and the main menu: " + secs(now - startupStart));
        }
        detail.textContent = lines.join("\n");
      }
      var loadDetailTimer = setInterval(showLoadDetail, 200);
      function stopLoadDetail() {
        clearInterval(loadDetailTimer);
        if (startupStart) console.log("[Loading] Engine startup: " + secs(performance.now() - startupStart));
        console.log("[Loading] Total: " + secs(performance.now() - loadStart));
      }

      var script = document.createElement("script");
      script.onload = function () {
        if (script.src.indexOf("blob:") === 0) URL.revokeObjectURL(script.src);
        createUnityInstance(canvas, config, function (progress) {
          fill.style.width = Math.round(progress * 100) + "%";
          document.getElementById("bar").setAttribute("aria-valuenow", Math.round(progress * 100));
        }).then(function (instance) {
          restoreDownloads();
          unityInstance = instance;
          stopLoadDetail();
          resyncAfterLoad();
          loading.classList.add("done");
          if (!standalone) fsButton.style.display = "flex";
          canvas.focus();
          maybeShowIosHintOnce();
          watchForUpdates();
        }).catch(function (message) {
          restoreDownloads();
          clearInterval(loadDetailTimer);
          showError(String(message));
        });
      };
      // A new version went live: save, tell everyone, and reload onto it (players and spectators
      // alike). Checks version.json (written next to this page by every build) once a minute.
      function watchForUpdates() {
        if (v === "") return; // a local build that was never stamped
        setInterval(function () {
          fetch("version.json?t=" + Date.now(), { cache: "no-store" })
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (info) {
              if (info && info.build && info.build !== BUILD_ID) reloadForUpdate();
            })
            .catch(function () { /* offline for a moment: try again next time */ });
        }, 60000);
      }

      // Cover and freeze immediately, then wait for Unity's durable save acknowledgement.
      var updating = false;
      function reloadForUpdate() {
        if (updating) return;
        updating = true;
        document.getElementById("loading-title").textContent = "Updating...";
        document.getElementById("detail").textContent = "Saving your character...";
        loading.classList.remove("done");
        fill.style.width = "0%";
        window.poeUpdateSaved = function (error) {
          window.poeUpdateSaved = null;
          if (error) {
            showError("The update could not save your progress. Please reload when browser storage is available. " + error);
            return;
          }
          location.reload();
        };
        try { unityInstance.SendMessage("GameSessionController", "BeginUpdate"); }
        catch (e) { window.poeUpdateSaved(String(e)); }
      }
      window.poeReloadForUpdate = reloadForUpdate;

      script.onerror = function () {
        restoreDownloads(); clearInterval(loadDetailTimer);
        if (script.src.indexOf("blob:") === 0) URL.revokeObjectURL(script.src);
        showError("The game files failed to load. Try reloading the page.");
      };
      if (typeof downloadChunks === "object") {
        restoreDownloads = installChunkDownloads(downloadChunks, v, function (url, loaded, total) {
          var key = Object.keys(config.downloadProgress).find(function (key) {
            return new URL(key, document.baseURI).href === url;
          }) || url;
          var p = config.downloadProgress[key] || (config.downloadProgress[key] = {});
          p.started = true; p.lengthComputable = true; p.loaded = loaded; p.total = total;
          p.wireLoaded = loaded; p.wireTotal = total;
          var downloads = Object.values(config.downloadProgress);
          var received = downloads.reduce(function (sum, item) { return sum + (item.wireLoaded || 0); }, 0);
          var expected = Object.values(downloadChunks).reduce(function (sum, item) { return sum + (item.transferSize || item.size); }, 0);
          fill.style.width = Math.round(90 * received / expected) + "%";
        });
        fetch("Build/WebGL.loader.js" + v).then(function (response) { return response.blob(); })
          .then(function (blob) {
            script.src = URL.createObjectURL(new Blob([blob], { type: "application/javascript" }));
            document.body.appendChild(script);
          }).catch(function (error) { restoreDownloads(); clearInterval(loadDetailTimer); showError(String(error)); });
      } else {
        script.src = "Build/WebGL.loader.js";
        document.body.appendChild(script);
      }
    </script>
  </body>
</html>
