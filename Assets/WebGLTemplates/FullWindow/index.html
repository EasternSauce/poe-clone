<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
      /* The canvas always fills the window; Unity matches its render resolution to this size. */
      #game-canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; background: #000; outline: none; }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
                 gap: 18px; color: #e8e2d4; font: 600 20px/1.3 system-ui, sans-serif; background: #000; transition: opacity .4s; }
      #loading.done { opacity: 0; pointer-events: none; }
      #bar { width: min(360px, 70vw); height: 8px; border-radius: 4px; background: #2a2622; overflow: hidden; }
      #bar-fill { width: 0; height: 100%; background: #b3412e; transition: width .2s; }
      #error { display: none; max-width: 80vw; color: #f2b8a8; font-weight: 400; font-size: 15px; text-align: center; }
      #fullscreen { position: fixed; top: 12px; right: 12px; width: 40px; height: 40px; border: 0; border-radius: 6px; cursor: pointer;
                    background: rgba(0,0,0,.45); color: #fff; opacity: .7; display: none; align-items: center; justify-content: center; }
      #fullscreen:hover, #fullscreen:focus-visible { opacity: 1; background: rgba(0,0,0,.7); }
      #fullscreen svg { width: 22px; height: 22px; }
    </style>
  </head>
  <body>
    <canvas id="game-canvas" tabindex="-1"></canvas>
    <div id="loading" role="status" aria-live="polite">
      <div>{{{ PRODUCT_NAME }}}</div>
      <div id="bar" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100"><div id="bar-fill"></div></div>
      <div id="error"></div>
    </div>
    <button id="fullscreen" type="button" aria-label="Toggle fullscreen" title="Fullscreen (F11 also works)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
    <script>
      var canvas = document.getElementById("game-canvas");
      var loading = document.getElementById("loading");
      var fill = document.getElementById("bar-fill");
      var errorBox = document.getElementById("error");
      var fsButton = document.getElementById("fullscreen");

      function showError(message) {
        errorBox.textContent = message;
        errorBox.style.display = "block";
        loading.classList.remove("done");
      }

      // Fullscreen the whole page rather than the canvas: the canvas is already sized to the
      // page, so it simply grows with it and Unity follows the new size. (Unity's own
      // canvas-fullscreen path is what produced a black screen.)
      fsButton.addEventListener("click", function () {
        if (document.fullscreenElement) document.exitFullscreen();
        else document.documentElement.requestFullscreen().catch(function () {});
        canvas.focus();
      });

      // Clicking the game gives it keyboard focus (and takes it away from the button).
      canvas.addEventListener("pointerdown", function () { canvas.focus(); });

      var config = {
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        // Sharp on high-DPI screens, but capped so 4K laptops don't render 4x the pixels.
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        showBanner: function (msg, type) { if (type === "error") showError(msg); else console.warn(msg); }
      };

      var script = document.createElement("script");
      script.src = "Build/{{{ LOADER_FILENAME }}}";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          fill.style.width = Math.round(progress * 100) + "%";
          document.getElementById("bar").setAttribute("aria-valuenow", Math.round(progress * 100));
        }).then(function () {
          loading.classList.add("done");
          fsButton.style.display = "flex";
          canvas.focus();
        }).catch(function (message) {
          showError(String(message));
        });
      };
      script.onerror = function () { showError("The game files failed to load. Try reloading the page."); };
      document.body.appendChild(script);
    </script>
  </body>
</html>
