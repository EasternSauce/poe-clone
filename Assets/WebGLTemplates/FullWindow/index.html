<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>{{{ PRODUCT_NAME }}}</title>
    <!-- iPhone Safari has no fullscreen for web pages, but "Add to Home Screen" opens the game as a
         full-screen app (no Safari bars). The manifest has no start_url, so the icon opens the
         address it was added from (a spectator link stays a spectator link). -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PoE Clone">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
      /* Fullscreen a dedicated container and lay out the WebGL canvas inside it, so the browser
         sizes the game and its controls together. Keep notch insets in the top/bottom only. */
      #game-root { position: fixed; inset: 0; overflow: hidden; background: #000;
                   padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
                   box-sizing: border-box; }
      #game-root:fullscreen { width: 100%; height: 100%; margin: 0; max-width: none; max-height: none; }
      #game-root:-webkit-full-screen { width: 100%; height: 100%; margin: 0; max-width: none; max-height: none; }
      /* JavaScript commits pixel CSS dimensions after the viewport settles. Unity owns the
         drawing buffer; changing canvas.width/height here would invalidate its render state. */
      #game-canvas { position: absolute; display: block; background: #000; outline: none;
                     left: 0; top: env(safe-area-inset-top, 0px); width: 100%;
                     height: calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); }
      #fullscreen-cover { position: absolute; inset: 0; z-index: 1; background: #000;
                          opacity: 0; pointer-events: none; transition: opacity .12s; }
      #fullscreen-cover.active { opacity: 1; transition: none; }
      /* Touch: no browser gestures on the game (pinch zoom, double-tap zoom, pull-to-refresh), and
         no text selection / iOS callout when a finger is held down (the inventory uses long presses). */
      html, body, #game-canvas { touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
                                 -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      #loading { z-index: 2; position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
                 gap: 18px; color: #e8e2d4; font: 600 20px/1.3 system-ui, sans-serif; background: #000; transition: opacity .4s; }
      #loading.done { opacity: 0; pointer-events: none; }
      @media (pointer: coarse) {
        #loading { padding: 24px; box-sizing: border-box; font-size: 26px; text-align: center; }
        #loading #detail { font-size: 18px; line-height: 1.45; color: #c9c1b3; max-width: 100%; overflow-wrap: anywhere; }
        #loading #error { font-size: 18px; }
      }
      #bar { width: min(360px, 70vw); height: 8px; border-radius: 4px; background: #2a2622; overflow: hidden; }
      #bar-fill { width: 0; height: 100%; background: #b3412e; transition: width .2s; }
      #detail { min-height: 5.2em; color: #9a9284; font-weight: 400; font-size: 14px; text-align: center; white-space: pre-line; }
      #error { display: none; max-width: 80vw; color: #f2b8a8; font-weight: 400; font-size: 15px; text-align: center; }
      #fullscreen { z-index: 3; position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); width: 40px; height: 40px; border: 0; border-radius: 6px; cursor: pointer;
                    background: rgba(0,0,0,.45); color: #fff; opacity: .7; display: none; align-items: center; justify-content: center; }
      #fullscreen:hover, #fullscreen:focus-visible { opacity: 1; background: rgba(0,0,0,.7); }
      #fullscreen svg { width: 22px; height: 22px; }
      /* On phones the top right holds the game's own buttons, so fullscreen moves to the top middle. */
      @media (pointer: coarse) { #fullscreen { right: auto; left: 50%; transform: translateX(-50%); } }
      /* iPhone: how to get the game full screen (Add to Home Screen). */
      #ios-hint { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
                  padding: 16px; background: rgba(0,0,0,.6); font: 16px/1.4 system-ui, sans-serif; color: #e8e2d4; }
      #ios-hint[hidden] { display: none; }
      #ios-hint .card { max-width: 380px; padding: 20px 22px; border-radius: 10px; background: #1b1512; border: 2px solid #8c6b37;
                        box-shadow: 0 8px 30px rgba(0,0,0,.6); }
      #ios-hint h2 { margin: 0 0 8px; font-size: 20px; color: #dcb86b; }
      #ios-hint p { margin: 0 0 10px; }
      #ios-hint ol { margin: 0 0 16px; padding-left: 22px; }
      #ios-hint li { margin: 6px 0; }
      #ios-hint svg { width: 18px; height: 18px; vertical-align: -3px; color: #7fb4ff; }
      #ios-hint button { width: 100%; padding: 10px; border: 0; border-radius: 6px; background: #b3412e; color: #fff;
                         font: 600 16px system-ui, sans-serif; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="game-root">
      <canvas id="game-canvas" tabindex="-1"></canvas>
      <div id="fullscreen-cover" aria-hidden="true"></div>
      <div id="loading" role="status" aria-live="polite">
        <div id="loading-title">{{{ PRODUCT_NAME }}}</div>
        <div id="bar" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100"><div id="bar-fill"></div></div>
        <div id="detail"></div>
        <div id="error"></div>
      </div>
      <button id="fullscreen" type="button" aria-label="Toggle fullscreen" title="Fullscreen (F11 also works)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
      <div id="ios-hint" role="dialog" aria-modal="true" aria-labelledby="ios-hint-title" hidden>
        <div class="card">
          <h2 id="ios-hint-title">Play full screen</h2>
          <p>Safari on iPhone can't make a web page full screen, but the game can run like an app:</p>
          <ol>
            <li>Tap <b>Share</b>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M8 7l4-4 4 4M6 11H5v10h14V11h-1"/></svg>
              in Safari's toolbar (on newer iPhones it's in the <b>&middot;&middot;&middot;</b> menu).</li>
            <li>Choose <b>Add to Home Screen</b>.</li>
            <li>Open the game from its new icon.</li>
          </ol>
          <button id="ios-hint-close" type="button">Got it</button>
        </div>
      </div>
    </div>
    <script>
      var canvas = document.getElementById("game-canvas");
      var loading = document.getElementById("loading");
      var fill = document.getElementById("bar-fill");
      var errorBox = document.getElementById("error");
      var fsButton = document.getElementById("fullscreen");
      try {
        if (sessionStorage.getItem("PoeClone.UpdateResume"))
          document.getElementById("loading-title").textContent = "Updating...";
      } catch (e) { }

      function showError(message) {
        errorBox.textContent = message;
        errorBox.style.display = "block";
        loading.classList.remove("done");
      }

      // Fullscreen: desktop browsers, Android and iPad have the Fullscreen API (Safari's is
      // prefixed); iPhone Safari doesn't, so there the button explains Add to Home Screen instead.
      // Opened from the Home Screen the game is already full screen, so the button isn't shown.
      var root = document.getElementById("game-root");
      var fullscreenCover = document.getElementById("fullscreen-cover");
      var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      var standalone = navigator.standalone === true ||
        (window.matchMedia && (window.matchMedia("(display-mode: standalone)").matches || window.matchMedia("(display-mode: fullscreen)").matches));
      var canFullscreen = !!(root.requestFullscreen || root.webkitRequestFullscreen) &&
        (document.fullscreenEnabled || document.webkitFullscreenEnabled) === true;
      var iosHint = document.getElementById("ios-hint");

      function showIosHint() { iosHint.hidden = false; document.getElementById("ios-hint-close").focus(); }
      document.getElementById("ios-hint-close").addEventListener("click", function () {
        iosHint.hidden = true;
        canvas.focus();
      });

      var fullscreenCoverTimer = 0;
      function coverFullscreenTransition() {
        fullscreenCover.classList.add("active");
        clearTimeout(fullscreenCoverTimer);
        // A stalled render or a stream of viewport events must never leave the game covered.
        fullscreenCoverTimer = setTimeout(function () { fullscreenCover.classList.remove("active"); }, 2000);
      }

      // Keep HTML controls inside the fullscreen container. Request fullscreen directly in
      // the click handler: deferring the request loses the browser's user-gesture permission.
      fsButton.addEventListener("click", function () {
        if (!canFullscreen) {
          showIosHint();
          return;
        }
        coverFullscreenTransition();
        var result;
        try {
          if (document.fullscreenElement || document.webkitFullscreenElement)
            result = (document.exitFullscreen || document.webkitExitFullscreen).call(document);
          else
            result = (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
        } catch (e) {
          fullscreenCover.classList.remove("active");
          return;
        }
        if (result && result.then) result.then(settleCanvasSize, function () {
          fullscreenCover.classList.remove("active");
          settleCanvasSize();
        });
        settleCanvasSize(); // Also handles prefixed APIs without a Promise or a rejected request.
      });

      // On an iPhone in Safari, explain it once without being asked (the button repeats it).
      function maybeShowIosHintOnce() {
        if (!isIOS || standalone || canFullscreen) return;
        try {
          if (localStorage.getItem("poeclone.iosHintShown")) return;
          localStorage.setItem("poeclone.iosHintShown", "1");
        } catch (e) {
          return; // storage blocked: don't nag on every visit
        }
        showIosHint();
      }

      // Clicking the game gives it keyboard focus (and takes it away from the button).
      canvas.addEventListener("pointerdown", function () { canvas.focus(); });

      // Right click is a game button. Unity only blocks the menu on the canvas itself, and
      // Firefox (just after alt-tabbing back) can send the event to the page instead, so block
      // it for the whole page, before anything else sees it.
      document.addEventListener("contextmenu", function (e) { e.preventDefault(); }, true);

      // The canvas renders at its CSS size x pixel ratio, and must not exceed the GPU's maximum
      // render size or WebGL silently draws nothing (black screen). Hardened browsers
      // (LibreWolf, Firefox with resistFingerprinting) report a minimal 2048px limit together
      // with a spoofed devicePixelRatio of 2, which a full-window canvas easily exceeds.
      var gpuLimit = (function () {
        try {
          var gl = document.createElement("canvas").getContext("webgl2") || document.createElement("canvas").getContext("webgl");
          if (!gl) return 4096;
          var viewport = gl.getParameter(gl.MAX_VIEWPORT_DIMS);
          var limit = Math.min(gl.getParameter(gl.MAX_RENDERBUFFER_SIZE), gl.getParameter(gl.MAX_TEXTURE_SIZE), viewport[0], viewport[1]);
          var lose = gl.getExtension("WEBGL_lose_context");
          if (lose) lose.loseContext();
          return limit;
        } catch (e) {
          return 4096;
        }
      })();

      // Sharp on high-DPI screens, capped at 2x (4K laptops shouldn't render 4x the pixels)
      // and at whatever keeps the canvas within the GPU limit. Phones get 1.5x: their 3x screens
      // are tiny, and every pixel costs battery and frame rate on a mobile GPU.
      var maxRatio = window.matchMedia && window.matchMedia("(pointer: coarse)").matches ? 1.5 : 2;
      function pixelRatio() {
        var longest = Math.max(canvas.clientWidth, canvas.clientHeight, 1);
        return Math.max(0.25, Math.min(window.devicePixelRatio || 1, maxRatio, (gpuLimit - 8) / longest));
      }

      var unityInstance = null;
      var canvasResizeFrame = 0;
      var canvasResizeVersion = 0;

      function canvasLayout() {
        var style = getComputedStyle(root);
        var top = parseFloat(style.paddingTop) || 0;
        var bottom = parseFloat(style.paddingBottom) || 0;
        return { width: Math.max(1, root.clientWidth), height: Math.max(1, root.clientHeight - top - bottom), top: top };
      }

      function syncCanvasSize(size) {
        size = size || canvasLayout();
        canvas.style.width = size.width + "px";
        canvas.style.height = size.height + "px";
        canvas.style.top = size.top + "px";
        var module = unityInstance ? unityInstance.Module : config;
        if (module) module.devicePixelRatio = pixelRatio();
      }

      function settleCanvasSize() {
        cancelAnimationFrame(canvasResizeFrame);
        var version = ++canvasResizeVersion;
        var started = performance.now(), stableSince = started, previous = "";
        function settle(now) {
          var size = canvasLayout();
          var key = size.width + ":" + size.height + ":" + size.top;
          if (key !== previous) { previous = key; stableSince = now; }
          // Mobile fullscreen and toolbar animations report several intermediate viewport sizes.
          // Keep the old buffer until the layout is quiet, then let Unity resize it once.
          if (now - stableSince < 150 && now - started < 1000) {
            canvasResizeFrame = requestAnimationFrame(settle);
            return;
          }
          syncCanvasSize(size);
          var readySince = 0, committed = now;
          function waitForRender(frameTime) {
            if (version !== canvasResizeVersion) return;
            var ratio = pixelRatio();
            var ready = Math.abs(canvas.width - Math.round(size.width * ratio)) <= 1 &&
                        Math.abs(canvas.height - Math.round(size.height * ratio)) <= 1;
            if (!ready) readySince = 0;
            else if (!readySince) readySince = frameTime;
            // Give Unity time to draw into the new buffer. Release the cover even if the
            // drawing-buffer dimensions are rounded differently by the browser.
            if ((readySince && frameTime - readySince >= 50) || frameTime - committed >= 1000) {
              fullscreenCover.classList.remove("active");
              canvasResizeFrame = 0;
              return;
            }
            canvasResizeFrame = requestAnimationFrame(waitForRender);
          }
          canvasResizeFrame = requestAnimationFrame(waitForRender);
        }
        canvasResizeFrame = requestAnimationFrame(settle);
      }
      function fullscreenChanged() {
        coverFullscreenTransition();
        settleCanvasSize();
        canvas.focus();
      }
      window.addEventListener("resize", settleCanvasSize);
      window.addEventListener("orientationchange", settleCanvasSize);
      if (window.visualViewport) window.visualViewport.addEventListener("resize", settleCanvasSize);
      if (window.ResizeObserver) new ResizeObserver(settleCanvasSize).observe(root);
      document.addEventListener("fullscreenchange", fullscreenChanged);
      document.addEventListener("webkitfullscreenchange", fullscreenChanged);

      // Esc is the game's menu key, but in fullscreen the browser takes the first press to leave
      // fullscreen. Chrome and Edge let a fullscreen page keep Esc (Keyboard Lock); holding Esc
      // still leaves fullscreen. Only works for the button's fullscreen, not F11, and other
      // browsers don't offer it.
      document.addEventListener("fullscreenchange", function () {
        if (!navigator.keyboard || !navigator.keyboard.lock) return;
        if (document.fullscreenElement) navigator.keyboard.lock(["Escape"]).catch(function () {});
        else navigator.keyboard.unlock();
      });

      // Loading and fullscreen may finish in either order. Use the same settled-size path.
      function resyncAfterLoad() { settleCanvasSize(); }
      syncCanvasSize();

      // Small scripts remain build-versioned; large downloads reuse verified content pieces.
      var BUILD_ID = "__BUILD_ID__";
      var v = BUILD_ID.indexOf("__") === 0 ? "" : "?v=" + encodeURIComponent(BUILD_ID);
      var downloadChunks = "__DOWNLOAD_CHUNKS__";
      var restoreDownloads = function () {};
      // __INLINE_DOWNLOADER__

      var config = {
        dataUrl: "Build/{{{ DATA_FILENAME }}}" + v,
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}" + v,
#if USE_THREADS
        workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}" + v,
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        // Music bundles are named after their contents, so a cached copy is always current. Pages
        // gives every deploy new ETags, which otherwise re-downloads all music after each update.
        cacheControl: function (url) {
          if (/(^|\/)StreamingAssets\/Music\/[^?]+-[0-9a-f]{12}\.bundle$/.test(url)) return "immutable";
          return /\.bundle/.test(url) ? "must-revalidate" : "no-store";
        },
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        devicePixelRatio: pixelRatio(),
        // The loader copies this object into its module and fills in each file's bytes, keyed by URL.
        downloadProgress: {},
        showBanner: function (msg, type) { if (type === "error") showError(msg); else console.warn(msg); }
      };

      // What is downloading under the bar, then how long engine startup takes, so a slow load
      // can be pinned on a file or on startup. Each finished step is also logged to the console.
      var detail = document.getElementById("detail");
      var loadFiles = [
        { match: ".data", label: "Game assets (scenes, models, textures, sounds)" },
        { match: ".wasm", label: "Game code" },
        { match: ".framework.js", label: "Engine scripts" }
      ];
      var loadStart = performance.now(), startupStart = 0;
      function mb(bytes) { return (bytes / 1048576).toFixed(1) + " MB"; }
      function secs(ms) { return (ms / 1000).toFixed(1) + " s"; }
      function showLoadDetail() {
        var now = performance.now(), allDone = true, lines = [];
        loadFiles.forEach(function (f) {
          var url = Object.keys(config.downloadProgress).filter(function (u) { return u.indexOf(f.match) >= 0; })[0];
          var p = url ? config.downloadProgress[url] : null;
          if (p && p.finished && !f.end) {
            f.end = now;
            console.log("[Loading] " + f.label + ": " + mb(p.loaded) + " in " + secs(now - loadStart));
          }
          if (!f.end) allDone = false;
          lines.push(f.label + ": " + (f.end ? "done, " + mb(p.loaded) + " in " + secs(f.end - loadStart)
            : p && p.started ? mb(p.loaded) + (p.lengthComputable ? " of " + mb(p.total) : "") : "waiting"));
        });
        if (allDone) {
          if (!startupStart) startupStart = now;
          lines.push("Unpacking, starting the engine and the main menu: " + secs(now - startupStart));
        }
        detail.textContent = lines.join("\n");
      }
      var loadDetailTimer = setInterval(showLoadDetail, 200);
      function stopLoadDetail() {
        clearInterval(loadDetailTimer);
        if (startupStart) console.log("[Loading] Engine startup: " + secs(performance.now() - startupStart));
        console.log("[Loading] Total: " + secs(performance.now() - loadStart));
      }

      var script = document.createElement("script");
      script.onload = function () {
        if (script.src.indexOf("blob:") === 0) URL.revokeObjectURL(script.src);
        createUnityInstance(canvas, config, function (progress) {
          fill.style.width = Math.round(progress * 100) + "%";
          document.getElementById("bar").setAttribute("aria-valuenow", Math.round(progress * 100));
        }).then(function (instance) {
          restoreDownloads();
          unityInstance = instance;
          stopLoadDetail();
          resyncAfterLoad();
          loading.classList.add("done");
          if (!standalone) fsButton.style.display = "flex";
          canvas.focus();
          maybeShowIosHintOnce();
          watchForUpdates();
        }).catch(function (message) {
          restoreDownloads();
          clearInterval(loadDetailTimer);
          showError(String(message));
        });
      };
      // A new version went live: save, tell everyone, and reload onto it (players and spectators
      // alike). Checks version.json (written next to this page by every build) once a minute.
      function watchForUpdates() {
        if (v === "") return; // a local build that was never stamped
        setInterval(function () {
          fetch("version.json?t=" + Date.now(), { cache: "no-store" })
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (info) {
              if (info && info.build && info.build !== BUILD_ID) reloadForUpdate();
            })
            .catch(function () { /* offline for a moment: try again next time */ });
        }, 60000);
      }

      // Cover and freeze immediately, then wait for Unity's durable save acknowledgement.
      var updating = false;
      function reloadForUpdate() {
        if (updating) return;
        updating = true;
        document.getElementById("loading-title").textContent = "Updating...";
        document.getElementById("detail").textContent = "Saving your character...";
        loading.classList.remove("done");
        fill.style.width = "0%";
        window.poeUpdateSaved = function (error) {
          window.poeUpdateSaved = null;
          if (error) {
            showError("The update could not save your progress. Please reload when browser storage is available. " + error);
            return;
          }
          location.reload();
        };
        try { unityInstance.SendMessage("GameSessionController", "BeginUpdate"); }
        catch (e) { window.poeUpdateSaved(String(e)); }
      }
      window.poeReloadForUpdate = reloadForUpdate;

      script.onerror = function () {
        restoreDownloads(); clearInterval(loadDetailTimer);
        if (script.src.indexOf("blob:") === 0) URL.revokeObjectURL(script.src);
        showError("The game files failed to load. Try reloading the page.");
      };
      if (typeof downloadChunks === "object") {
        restoreDownloads = installChunkDownloads(downloadChunks, v, function (url, loaded, total) {
          var key = Object.keys(config.downloadProgress).find(function (key) {
            return new URL(key, document.baseURI).href === url;
          }) || url;
          var p = config.downloadProgress[key] || (config.downloadProgress[key] = {});
          p.started = true; p.lengthComputable = true; p.loaded = loaded; p.total = total;
          var downloads = Object.values(config.downloadProgress);
          var received = downloads.reduce(function (sum, item) { return sum + (item.loaded || 0); }, 0);
          var expected = Object.values(downloadChunks).reduce(function (sum, item) { return sum + item.size; }, 0);
          fill.style.width = Math.round(90 * received / expected) + "%";
        });
        fetch("Build/{{{ LOADER_FILENAME }}}" + v).then(function (response) { return response.blob(); })
          .then(function (blob) {
            script.src = URL.createObjectURL(new Blob([blob], { type: "application/javascript" }));
            document.body.appendChild(script);
          }).catch(function (error) { restoreDownloads(); clearInterval(loadDetailTimer); showError(String(error)); });
      } else {
        script.src = "Build/{{{ LOADER_FILENAME }}}";
        document.body.appendChild(script);
      }
    </script>
  </body>
</html>
